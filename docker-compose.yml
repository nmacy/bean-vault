services:
  coffee-tracker:
    image: nmacy/coffee-tracker:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - coffee-tracker-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  coffee-tracker-data: