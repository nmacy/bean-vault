services:
  bean-vault:
    image: ghcr.io/nmacy/bean-vault:latest
    container_name: bean-vault
    restart: unless-stopped
    ports:
      # Host port is configurable: set BEAN_VAULT_PORT=8080 in .env
      - "${BEAN_VAULT_PORT:-3000}:3000"
    environment:
      # Optional. The app can also store the key/model in Settings (preferred);
      # these env values are the fallback. Values come from a .env file next to
      # this compose file (copy .env.example) or the host environment.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      TZ: ${TZ:-UTC}
    volumes:
      # Everything persistent: SQLite DB + uploaded photos.
      - bean-vault-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bean-vault-data: